<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#120d1d" />
  <title>奶蛙保龄球</title>
  <!-- 引入样式表：网页的"皮肤"（?v= 是版本号，防止浏览器用旧缓存） -->
  <link rel="stylesheet" href="style.css?v=2.5" />
</head>
<body>
  <div class="stage">
    <!-- 游戏画面全部画在这块 480×720 的"逻辑坐标纸"上 -->
    <canvas id="game" width="480" height="720"></canvas>

    <!-- 记分板：用 HTML 做文字排版比 canvas 省事，10 格标准保龄球记分 -->
    <div class="board" id="board"></div>

    <!-- 设置：音效 / 全中大笑 开关 -->
    <button class="gear" id="gearBtn" title="设置">⚙</button>
    <div class="settings hidden" id="settings">
      <label class="row"><input type="checkbox" id="optSound" /> <span>音效</span></label>
      <label class="row"><input type="checkbox" id="optLaugh" /> <span>全中大笑</span></label>
      <div class="vols">
        <label class="vol"><span>背景音乐</span><input type="range" id="volBgm" min="0" max="100" value="42" /><b id="volBgmVal">42</b></label>
        <label class="vol"><span>投球声</span><input type="range" id="volThrow" min="0" max="100" value="90" /><b id="volThrowVal">90</b></label>
        <label class="vol"><span>撞瓶声</span><input type="range" id="volHit" min="0" max="100" value="80" /><b id="volHitVal">80</b></label>
        <label class="vol"><span>全中大笑</span><input type="range" id="volLaugh" min="0" max="100" value="95" /><b id="volLaughVal">95</b></label>
        <label class="vol"><span>结算动画</span><input type="range" id="volRecord" min="0" max="100" value="80" /><b id="volRecordVal">80</b></label>
      </div>
      <button class="mini" id="clearBestBtn">清空本机最高分</button>
      <p class="ver" id="verLine">版本 —</p>
    </div>

    <!-- 开始界面 -->
    <div class="overlay" id="titleScreen">
      <h1>奶蛙保龄球</h1>
      <p class="sub">FROG BOWLING</p>
      <p class="desc">
        <b>按住屏幕</b>：指针停住并开始蓄力，<b>松开投球</b>。<br />
        打满 10 格，全中和补中有额外加分。
      </p>
      <button class="btn" id="startBtn" disabled>载 入 中…</button>
      <p class="best">最高分：<span id="startBest">0</span></p>
    </div>

    <!-- 结束界面（破纪录时换成庆祝版） -->
    <div class="overlay hidden" id="overScreen">
      <h2 id="recTitle">比赛结束</h2>
      <p class="final" id="finalScore">0</p>
      <p class="desc" id="finalComment">这局打得不错。</p>
      <div class="clip hidden" id="clipBox">
        <canvas id="recCanvas" width="200" height="200"></canvas>
      </div>
      <p class="best" id="bestLine">最高分：0</p>
      <button class="btn" id="retryBtn">再来一局</button>
    </div>

    <!-- 出错时把原因显示在屏幕上（排错用，正常玩看不到） -->
    <div class="crash hidden" id="crash">
      <h3>页面出错了</h3>
      <pre id="crashMsg"></pre>
      <p>按 F12 → Console 看详细堆栈。点这里可以关掉。</p>
    </div>
  </div>

  <script>
    (function () {
      var box = document.getElementById('crash');
      var msg = document.getElementById('crashMsg');
      window.__showError = function (t) { msg.textContent = String(t); box.classList.remove('hidden'); };
      box.addEventListener('click', function () { box.classList.add('hidden'); });

      window.addEventListener('error', function (e) {
        window.__showError((e.message || '脚本错误') + '\n文件: ' + (e.filename || '?') + '   行: ' + (e.lineno || '?'));
      });

      // 必须等 load 之后再判断：单文件版是一个 9MB 的 HTML，
      // 网慢时脚本要下载好几秒，用固定延时会在"还没跑起来"时误报。
      window.addEventListener('load', function () {
        setTimeout(function () {
          if (!window.__GAME_BOOTED__) {
            window.__showError('game.js 没有执行，所以按钮点了也没反应。\n\n' +
              '1. 确认是用浏览器打开的（不是聊天窗口的预览）\n' +
              '2. 确认 index.html 和 game.js 在同一个文件夹\n' +
              '3. 确认 assets 文件夹里的图片没被移动');
          }
        }, 500);
      });
    })();
  </script>

  <script src="game.js?v=2.5"></script>
</body>
</html>
